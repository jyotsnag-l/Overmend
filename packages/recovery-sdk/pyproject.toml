[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recovery-sdk"
version = "0.1.0"
description = "Recovery SDK for application monitoring"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.20.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["recovery_sdk*"]
