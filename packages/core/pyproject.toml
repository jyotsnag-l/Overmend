[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core"
version = "0.1.0"
description = "Core library for Autonomous Software Recovery & Trust PaaS"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "shared",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
