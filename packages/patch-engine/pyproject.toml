[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-engine"
version = "0.1.0"
description = "Patch engine package"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "unidiff>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["patch_engine*"]
