[metadata]
name = agent_sdk
version = 0.1.0
description = Autonomous Software Recovery & Trust PaaS
author = Your Name
author_email = you@example.com
license = MIT

[options]
packages = find:
py_modules = payments, users
include_package_data = true
exclude =
    apps*
    frontend*
    infrastructure*
    scratch*
    tests*
    docs*
    *.egg-info
    build
    dist
install_requires =
    fastapi>=0.115.0
    uvicorn[standard]>=0.30.0
    sqlalchemy[asyncio]>=2.0.34
    aiosqlite>=0.20.0
    celery>=5.4.0
    redis>=5.0.0
    httpx>=0.27.0
    pydantic>=2.8.0
    python-dotenv>=1.0.0
