<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Neon Infinity Loop Gradients -->
    <linearGradient id="neonIndigoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="neonCyanEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="90" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4" />

  <!-- Outer Shield Aura -->
  <path d="M 250,75 L 380,135 V 265 C 380,350 250,420 250,420 C 250,420 120,350 120,265 V 135 Z"
        fill="none" stroke="url(#neonIndigoCyan)" stroke-width="6" opacity="0.3" filter="url(#neonGlow)" />

  <!-- Primary Shield Geometry -->
  <path d="M 250,95 L 360,145 V 255 C 360,330 250,395 250,395 C 250,395 140,330 140,255 V 145 Z"
        fill="none" stroke="url(#neonIndigoCyan)" stroke-width="8" stroke-linejoin="round" opacity="0.9" />

  <!-- Infinity Healing Loop -->
  <path d="M 180,245 C 180,210 220,210 250,245 C 280,280 320,280 320,245 C 320,210 280,210 250,245 C 220,280 180,280 180,245 Z"
        fill="none" stroke="url(#neonCyanEmerald)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Code Brackets (Left & Right) -->
  <path d="M 195,225 L 175,245 L 195,265" fill="none" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 305,225 L 325,245 L 305,265" fill="none" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central AI Pulse Point -->
  <circle cx="250" cy="245" r="8" fill="#34D399" filter="url(#neonGlow)" />
</svg>
